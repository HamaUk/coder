# Render Blueprint — HAMA.
#
# AT THE REPO ROOT ON PURPOSE: a Render Blueprint only reads `render.yaml` from
# the root of the repository. It used to live in `deploy/`, which meant the file
# had to be moved by hand before "New → Blueprint" would find it — a step that is
# easy to miss and impossible to debug from the error Render gives you.
#
# WHAT TO EXPECT FROM THE FREE PLAN (read this before you click deploy):
#   * The service SLEEPS after a period of inactivity and the next request pays a
#     cold start of roughly a minute. Long agent turns hold the connection open,
#     so a turn in progress is not "inactive" — but the first request after a
#     quiet spell is slow.
#   * There is NO PERSISTENT DISK on the free plan. `data/` (provider keys, chats)
#     and `workspace/` (generated files) live inside the container and reset on
#     every redeploy, restart and wake. That is fine for trying the app out and
#     wrong for anything you want to keep — the README compares the hosts that do
#     give you a disk.
#   * Because the disk resets, the provider you add in the UI disappears on the
#     next restart. Set HAMA_PROVIDER_* below and it is re-added at every boot
#     (src/env-provider.js, additive only — it never touches a provider you
#     configured yourself).
services:
  - type: web
    name: hama-console
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Node 20 LTS: the newest version Render documents as supported, and the
      # app needs nothing newer than 18 (see "engines" in package.json).
      - key: NODE_VERSION
        value: "20"
      # The container platform decides the port; the app reads PORT.
      - key: HOST
        value: 0.0.0.0
      # REQUIRED. Without it the server REFUSES to bind a public interface and
      # exits — deliberately, because this console can run shell commands and
      # shows stored API keys. `sync: false` makes Render prompt for the value
      # instead of storing it here. Something long and random, e.g.
      #   node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      - key: HAMA_TOKEN
        sync: false

      # ---------------------------------------------------------------------
      # A provider that is re-created on every boot.
      #
      # Needed because the free plan has no disk: without this, the provider you
      # add in the UI is gone after every sleep, redeploy and restart, and the
      # console silently falls back to the built-in no-key engine.
      #
      # HAMA_PROVIDER_KEY is `sync: false`, so Render PROMPTS for it and it is
      # never stored in this file or in git. On the next Blueprint sync you will
      # be asked for it — paste your OpenRouter key there.
      # ---------------------------------------------------------------------
      - key: HAMA_PROVIDER_PRESET
        value: openrouter
      - key: HAMA_PROVIDER_KEY
        sync: false
      # Optional: defaults to the preset's model (openai/gpt-4o-mini — cheap and
      # competent). Use a stronger one for real coding work, e.g.
      # anthropic/claude-sonnet-4, openai/gpt-5, deepseek/deepseek-chat.
      # - key: HAMA_PROVIDER_MODEL
      #   value: anthropic/claude-sonnet-4
      # - key: HAMA_PROVIDER_NAME
      #   value: OpenRouter
